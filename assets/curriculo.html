<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currículo — Lucas Back | Desenvolvedor Júnior</title>

  <!-- Apenas Inter — fonte sóbria e legível para impressão -->
  <link rel="preconnect" href="https://googleapis.com" />
  <link rel="preconnect" href="https://gstatic.com" crossorigin />
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ================================================
       VARIÁVEIS E RESET
       ================================================ */
    :root {
      --accent: #6C63FF;      /* roxo — cor de identidade */
      --text: #1A1A2E;
      --text-muted: #5A5A7A;
      --border: #D0D0E8;
      --bg-sidebar: #F5F5FF;
      --bg-white: #FFFFFF;

      --font: 'Inter', sans-serif;

      --page-width: 210mm;    /* A4 */
      --page-height: 297mm;   /* A4 */
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background-color: #E8E8F0;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    ul { list-style: none; }
    a { text-decoration: none; color: inherit; }

    /* ================================================
       BARRA DE AÇÕES — visível apenas na tela, some ao imprimir
       ================================================ */
    .print-bar {
      background-color: var(--accent);
      color: #fff;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .print-bar p {
      font-size: 0.875rem;
      opacity: 0.9;
    }

    .print-bar p strong {
      opacity: 1;
    }

    .print-actions {
      display: flex;
      gap: 10px;
    }

    .btn-print {
      padding: 8px 20px;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
      font-family: var(--font);
    }

    .btn-print-primary {
      background-color: #fff;
      color: var(--accent);
    }

    .btn-print-primary:hover {
      background-color: rgba(255,255,255,0.9);
    }

    .btn-back {
      background-color: transparent;
      color: #fff;
      border-color: rgba(255,255,255,0.5);
    }

    .btn-back:hover {
      border-color: #fff;
    }

    /* ================================================
       PÁGINA A4 — container principal
       ================================================ */
    .page {
      width: var(--page-width);
      min-height: var(--page-height);
      background-color: var(--bg-white);
      margin: 24px auto;
      display: grid;
      grid-template-columns: 200px 1fr;
      box-shadow: 0 4px 40px rgba(0, 0, 0, 0.15);
    }

    /* ================================================
       SIDEBAR — coluna esquerda
       ================================================ */
    .sidebar {
      background-color: var(--bg-sidebar);
      border-right: 2px solid var(--accent);
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-section-title {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      margin-bottom: 2px;
    }

    .contact-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.4;
      word-break: break-word;
    }

    .contact-item svg {
      flex-shrink: 0;
      margin-top: 1px;
      color: var(--accent);
    }

    .skill-tag {
      display: inline-block;
      background-color: rgba(108, 99, 255, 0.08);
      border: 1px solid rgba(108, 99, 255, 0.2);
      color: var(--accent);
      font-size: 0.68rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
    }

    .skill-tag.learning {
      background-color: rgba(0, 212, 170, 0.08);
      border-color: rgba(0, 212, 170, 0.25);
      color: #00A884;
    }

    .skills-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .language-item {
      font-size: 0.75rem;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .language-level {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-style: italic;
    }

    /* ================================================
       COLUNA PRINCIPAL — conteúdo principal
       ================================================ */
    .main-content {
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .resume-header {
      border-bottom: 2px solid var(--accent);
      padding-bottom: 16px;
    }

    .resume-name {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .resume-role {
      font-size: 0.9rem;
      color: var(--accent);
      font-weight: 600;
      margin-top: 4px;
    }

    .cv-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cv-section-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .objective-text {
      font-size: 0.8rem;
      color: var(--text);
      line-height: 1.7;
    }

    .cv-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .cv-item-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent);
      margin-top: 5px;
      flex-shrink: 0;
    }

    .cv-item-body {
      flex: 1;
    }

    .cv-item-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    .cv-item-sub {
      font-size: 0.73rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .cv-item-period {
      font-size: 0.68rem;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .cv-item-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.5;
    }

    .status-pill {
      display: inline-block;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .status-pill.done {
      background-color: rgba(108, 99, 255, 0.1);
      color: var(--accent);
      border: 1px solid rgba(108, 99, 255, 0.2);
    }

    /* Ocultar barra de ações na impressão */
    @media print {
      .print-bar {
        display: none;
      }
      body {
        background-color: #fff;
      }
      .page {
        margin: 0;
        box-shadow: none;
        width: 100%;
        min-height: 100%;
      }
    }
  </style>
</head>
